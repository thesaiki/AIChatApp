apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          args:
            - --model
            - mistralai/Mistral-7B-Instruct-v0.3
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          ports:
            - containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              cpu: "2"
              memory: 16Gi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-service
  namespace: __NAMESPACE__
spec:
  selector:
    app: vllm
  ports:
    - port: 8000
      targetPort: 8000
