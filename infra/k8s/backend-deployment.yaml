apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: __BACKEND_IMAGE__
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: FRONTEND_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: ai-chat-config
                  key: FRONTEND_ORIGIN
            - name: LLM_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: ai-chat-config
                  key: LLM_BASE_URL
            - name: OBJECT_STORAGE_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: ai-chat-config
                  key: OBJECT_STORAGE_ENDPOINT
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: ai-chat-secrets
                  key: POSTGRES_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: ai-chat-secrets
                  key: REDIS_URL
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: ai-chat-secrets
                  key: SESSION_SECRET
            - name: OBJECT_STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-chat-secrets
                  key: OBJECT_STORAGE_ACCESS_KEY
            - name: OBJECT_STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-chat-secrets
                  key: OBJECT_STORAGE_SECRET_KEY
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-chat-secrets
                  key: LLM_API_KEY
                  optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
