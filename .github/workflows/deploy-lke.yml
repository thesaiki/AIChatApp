name: Deploy to Akamai LKE

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE_NAME: ${{ github.repository_owner }}/ai-chat-frontend
  BACKEND_IMAGE_NAME: ${{ github.repository_owner }}/ai-chat-backend
  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'ai-chat' }}
  OBJECT_STORAGE_BUCKET: ${{ vars.OBJECT_STORAGE_BUCKET || 'ai-chat-archive' }}
  OBJECT_STORAGE_ENDPOINT: ${{ vars.OBJECT_STORAGE_ENDPOINT || 'https://us-east-1.linodeobjects.com' }}
  LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        run: |
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend=${REGISTRY}/${FRONTEND_IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "backend=${REGISTRY}/${BACKEND_IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.backend }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.frontend }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Fetch kubeconfig from Akamai API
        env:
          LINODE_TOKEN: ${{ secrets.LINODE_TOKEN }}
          LKE_CLUSTER_ID: ${{ secrets.LKE_CLUSTER_ID }}
        run: |
          curl -sS \
            -H "Authorization: Bearer ${LINODE_TOKEN}" \
            "https://api.linode.com/v4/lke/clusters/${LKE_CLUSTER_ID}/kubeconfig" \
            | jq -r '.kubeconfig' \
            | base64 --decode > "${RUNNER_TEMP}/kubeconfig"
          echo "KUBECONFIG=${RUNNER_TEMP}/kubeconfig" >> "$GITHUB_ENV"

      - name: Create namespace
        run: |
          kubectl create namespace "${K8S_NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -

      - name: Create application secrets
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          OBJECT_STORAGE_ACCESS_KEY: ${{ secrets.OBJECT_STORAGE_ACCESS_KEY }}
          OBJECT_STORAGE_SECRET_KEY: ${{ secrets.OBJECT_STORAGE_SECRET_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          kubectl -n "${K8S_NAMESPACE}" create secret generic ai-chat-secrets \
            --from-literal=POSTGRES_URL="${POSTGRES_URL}" \
            --from-literal=SESSION_SECRET="${SESSION_SECRET}" \
            --from-literal=OBJECT_STORAGE_ACCESS_KEY="${OBJECT_STORAGE_ACCESS_KEY}" \
            --from-literal=OBJECT_STORAGE_SECRET_KEY="${OBJECT_STORAGE_SECRET_KEY}" \
            --from-literal=LLM_API_KEY="${LLM_API_KEY}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create registry pull secret when GHCR packages are private
        env:
          GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          if [ -z "${GHCR_PULL_USERNAME}" ] || [ -z "${GHCR_PULL_TOKEN}" ]; then
            echo "Skipping GHCR pull secret creation because optional GHCR credentials are not configured."
            exit 0
          fi

          kubectl -n "${K8S_NAMESPACE}" create secret docker-registry ghcr-creds \
            --docker-server="${REGISTRY}" \
            --docker-username="${GHCR_PULL_USERNAME}" \
            --docker-password="${GHCR_PULL_TOKEN}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Render manifests with deployment values
        env:
          BACKEND_IMAGE: ${{ steps.meta.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.meta.outputs.frontend }}
        run: |
          EFFECTIVE_LLM_BASE_URL="${LLM_BASE_URL:-http://vllm-service.${K8S_NAMESPACE}.svc.cluster.local:8000/v1}"
          cp -R infra/k8s "${RUNNER_TEMP}/k8s"
          find "${RUNNER_TEMP}/k8s" -name '*.yaml' -type f -exec \
            sed -i \
            -e "s|__BACKEND_IMAGE__|${BACKEND_IMAGE}|g" \
            -e "s|__FRONTEND_IMAGE__|${FRONTEND_IMAGE}|g" \
            -e "s|__NAMESPACE__|${K8S_NAMESPACE}|g" \
            -e "s|OBJECT_STORAGE_BUCKET: ai-chat-archive|OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET}|g" \
            -e "s|OBJECT_STORAGE_ENDPOINT: https://us-east-1.linodeobjects.com|OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT}|g" \
            -e "s|LLM_BASE_URL: http://vllm-service.${K8S_NAMESPACE}.svc.cluster.local:8000/v1|LLM_BASE_URL: ${EFFECTIVE_LLM_BASE_URL}|g" \
            {} +

      - name: Deploy manifests
        run: kubectl apply -k "${RUNNER_TEMP}/k8s"
